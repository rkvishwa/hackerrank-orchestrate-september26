services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buyorwait
      POSTGRES_USER: buyorwait
      POSTGRES_PASSWORD: buyorwait
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyorwait -d buyorwait"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    build: .
    command: python -c "from buy_or_wait.db.session import init_db; from buy_or_wait.config import Settings; init_db(Settings())"
    environment:
      DATABASE_URL: postgresql+psycopg://buyorwait:buyorwait@postgres:5432/buyorwait
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  prepare-artifacts:
    build: .
    user: "0:0"
    command: python -c "import os; os.makedirs('/output/evaluation', exist_ok=True); os.chown('/output', 10001, 10001); os.chown('/output/evaluation', 10001, 10001)"
    volumes:
      - ../artifacts:/output

  api:
    build: .
    command: uvicorn buy_or_wait.api.app:create_app --factory --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://buyorwait:buyorwait@postgres:5432/buyorwait
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      PYTHONPATH: /app/src
    volumes:
      - ../dataset:/dataset:ro
      - ../artifacts:/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      prepare-artifacts:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  worker:
    build: .
    command: celery -A buy_or_wait.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://buyorwait:buyorwait@postgres:5432/buyorwait
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      PYTHONPATH: /app/src
    volumes:
      - ../dataset:/dataset:ro
      - ../artifacts:/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      prepare-artifacts:
        condition: service_completed_successfully
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
